name: CI

# Tests and a test build for every push to main and every pull request.
# The build is not signed and not published; it is only kept as an artifact for 7 days.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (security + UI, offline, no Claude calls)
        run: npm test

      - name: Build installer and ZIP (unsigned, not published)
        run: npm run dist

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: swapline-ci-${{ github.sha }}
          path: |
            dist/Swapline-Setup-*.exe
            dist/Swapline-*-windows.zip
          if-no-files-found: error
          retention-days: 7
