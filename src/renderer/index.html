<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Swapline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Projektleiste -->
    <nav id="rail">
      <button class="rail-profile rail-all" id="rail-all" title="Allgemein – alle Chats">
        <div class="avatar globe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/></svg></div>
      </button>
      <div class="rail-sep"></div>
      <div id="rail-projects"></div>
      <button class="rail-btn" id="btn-add-project" title="Neues Projekt oder Ordner">+</button>
      <div class="rail-sep" id="rail-hosts-sep" hidden></div>
      <div id="rail-hosts"></div>
      <div class="rail-spacer"></div>
      <button class="rail-btn icon" id="btn-remote" title="Fernzugriff">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      </button>
      <button class="rail-btn icon" id="btn-extensions" title="Erweiterungen (Plugins, Skills)">
        <svg viewBox="0 0 24 24"><path d="M10 3h4v3a2 2 0 1 0 4 0V3h3v7h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H3v-7h3a2 2 0 1 0 0-4H3V3h7Z"/></svg>
      </button>
      <button class="rail-account" id="btn-account" title="Konto wechseln"></button>
      <button class="rail-btn icon" id="btn-settings" title="Einstellungen">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </nav>

    <!-- Seitenleiste -->
    <aside id="sidebar">
      <header id="profile-head">
        <div class="avatar lg" id="ph-avatar"></div>
        <div class="ph-text">
          <div id="ph-name"></div>
          <div id="ph-sub" class="muted"></div>
        </div>
        <button class="icon-btn" id="btn-project-edit" title="Projekt bearbeiten" hidden>
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
      </header>
      <div class="side-actions">
        <input id="search" type="search" placeholder="Suchen …">
        <button id="btn-new-chat" class="primary" title="Neuer Chat (Strg+N)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="seg" id="seg">
        <button data-view="chats" class="active" data-i18n>Chats</button>
        <button data-view="favorites" data-i18n>Favoriten</button>
        <button data-view="history" data-i18n>Verlauf</button>
      </div>
      <div id="list"></div>
      <section id="usage"></section>
    </aside>

    <!-- Chat -->
    <main id="chat">
      <div class="pane focused">
        <div id="empty" data-pid="empty" class="empty">
          <img class="empty-logo" src="assets/swapline.svg" alt="">
          <h1>Swapline</h1>
          <p class="muted" data-i18n>Starte einen neuen Chat oder öffne einen aus dem Verlauf.</p>
          <button class="primary big" id="btn-empty-new" data-pid="btn-empty-new" data-i18n>Neuer Chat</button>
        </div>

        <div id="chat-view" data-pid="chat-view" hidden>
          <header id="chat-head" data-pid="chat-head">
            <div class="avatar" id="ch-avatar" data-pid="ch-avatar"></div>
            <div class="ch-text">
              <div id="ch-title" data-pid="ch-title" title="Doppelklick zum Umbenennen"></div>
              <button id="ch-cwd" data-pid="ch-cwd" class="link muted" title="Ordner öffnen"></button>
            </div>
            <div class="ch-controls">
              <button class="icon-btn pane-btn" title="Zweiten Chat daneben öffnen (Strg+#)"></button>
              <button class="chat-chip" id="ch-settings" data-pid="ch-settings" title="Konto, Modell, Aufwand, Berechtigungen"></button>
            </div>
          </header>

          <div id="messages" data-pid="messages"></div>
          <div class="to-bottom-wrap"><button id="btn-bottom" data-pid="btn-bottom" class="to-bottom" title="Ganz nach unten (Strg+Ende)" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
          </button></div>

          <div id="bgbar" data-pid="bgbar" hidden></div>
          <div id="attachbar" data-pid="attachbar" hidden></div>
          <footer id="composer" data-pid="composer">
            <button id="btn-attach" data-pid="btn-attach" class="icon-btn attach" title="Bilder oder Dateien anhängen (auch per Strg+V oder Ziehen ins Fenster)">
              <svg viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>
            </button>
            <textarea id="input" data-pid="input" rows="1" placeholder="Nachricht an Claude …  (Enter = senden, Shift+Enter = neue Zeile, / = Befehle, ↑ = letzte Nachricht)"></textarea>
            <button id="btn-stop" data-pid="btn-stop" class="icon-btn danger" title="Stoppen (Esc)" hidden>
              <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
            <button id="btn-send" data-pid="btn-send" class="send" title="Senden">
              <svg viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-2.5-6.5L4 12Z"/></svg>
            </button>
          </footer>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
